name: works-889
version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: anime_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: anime_site
      MYSQL_USER: anime_user
      MYSQL_PASSWORD: anime_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - anime_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: anime_backend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./backend/src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: anime_site
      DB_USER: anime_user
      DB_PASS: anime_pass
    networks:
      - anime_network

volumes:
  mysql_data:

networks:
  anime_network:
    driver: bridge
